version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: docmind_user
      POSTGRES_PASSWORD: docmind_password
      POSTGRES_DB: docmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:rm -f .dockerignore